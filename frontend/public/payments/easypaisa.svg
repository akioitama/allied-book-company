<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 380" width="380" height="380" role="img" aria-label="Easypaisa">
  <title>Easypaisa</title>
  <!--
    Reference artwork: a dark egg-shaped "e" bowl on top with its counter cut
    towards the bottom-right, plus a thick green smile-shaped arc underneath.
    A white diagonal gap separates the two shapes. No wordmark in the source.
  -->
  <defs>
    <clipPath id="canvas">
      <rect x="0" y="0" width="380" height="380" />
    </clipPath>
  </defs>

  <g clip-path="url(#canvas)">
    <!-- Dark bowl: outer egg minus the offset counter. -->
    <mask id="bowl">
      <rect width="380" height="380" fill="#000" />
      <ellipse cx="190" cy="128" rx="140" ry="104" transform="rotate(-7 190 128)" fill="#fff" />
      <ellipse cx="222" cy="152" rx="80" ry="48" transform="rotate(-12 222 152)" fill="#000" />
    </mask>
    <rect width="380" height="380" fill="#2C2839" mask="url(#bowl)" />

    <!-- Green band: thick smile, ends sliced on a diagonal. -->
    <mask id="band">
      <rect width="380" height="380" fill="#000" />
      <path
        d="M26 196
           C30 306 112 358 200 358
           C288 358 348 316 360 244
           L296 262
           C284 302 246 318 198 318
           C136 318 84 288 70 204
           Z"
        fill="#fff"
      />
    </mask>
    <rect width="380" height="380" fill="#22B24C" mask="url(#band)" />
  </g>
</svg>
