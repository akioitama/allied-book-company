<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img" aria-label="JazzCash">
  <title>JazzCash</title>
  <!--
    Reference artwork: two interlocking crescents forming a "J" and a "C"
    (gold behind on the left, red in front on the right), black wordmark below.
    Each crescent is drawn as a large disc with an offset disc cut out, so the
    inner edge curves the same way the logo does.
  -->
  <defs>
    <clipPath id="crescents">
      <rect x="0" y="0" width="480" height="330" />
    </clipPath>
    <mask id="goldCrescent">
      <rect x="0" y="0" width="480" height="330" fill="#000" />
      <circle cx="200" cy="165" r="140" fill="#fff" />
      <circle cx="262" cy="165" r="140" fill="#000" />
    </mask>
    <mask id="redCrescent">
      <rect x="0" y="0" width="480" height="330" fill="#000" />
      <circle cx="280" cy="165" r="140" fill="#fff" />
      <circle cx="218" cy="165" r="140" fill="#000" />
    </mask>
  </defs>

  <g clip-path="url(#crescents)">
    <rect x="0" y="0" width="480" height="330" fill="#FBBE04" mask="url(#goldCrescent)" />
    <rect x="0" y="0" width="480" height="330" fill="#ED1C24" mask="url(#redCrescent)" />
  </g>

  <text
    x="240"
    y="410"
    text-anchor="middle"
    fill="#1A1A1A"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="96"
    font-weight="700"
  >JazzCash</text>
</svg>
